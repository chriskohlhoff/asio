name: asio CI for Windows

on:
  push:
    branches: [ master, citest-* ]
  workflow_dispatch:

concurrency:
  group: windows-gha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.runner }} ${{ matrix.arch }} ${{ matrix.toolset }} ${{ matrix.nmake-args }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, arch: x64, toolset: msvc }
          - { runner: windows-2022, arch: x86, toolset: msvc }
          - { runner: windows-2025, arch: x64, toolset: msvc }
          - { runner: windows-11-arm, arch: arm64, toolset: msvc }
          - { runner: windows-2022, arch: x64, toolset: mingw }
          - { runner: windows-2025, arch: x64, toolset: msvc, nmake-args: CXXLATEST=1 }
          - { runner: windows-2025, arch: x64, toolset: msvc, nmake-args: SEPARATE_COMPILATION=1 }
          - { runner: windows-2025, arch: x64, toolset: msvc, nmake-args: CL_EXE=clang-cl }
    steps:
      - uses: actions/checkout@v7

      - name: Locate MSVC
        if: matrix.toolset == 'msvc'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          "VCVARSALL=$vs\VC\Auxiliary\Build\vcvarsall.bat" >> $env:GITHUB_ENV

      - name: Compile perfetto backend (MSVC, header-only)
        if: matrix.toolset == 'msvc'
        shell: cmd
        run: |
          call "%VCVARSALL%" ${{ matrix.arch }} || exit /b 1
          cl /nologo /c /EHsc /std:c++17 /D_WIN32_WINNT=0x0A00 /DASIO_STANDALONE /DASIO_ENABLE_HANDLER_TRACKING=perfetto /Iinclude src\tests\handler_tracking\exercise.cpp || exit /b 1

      - name: Build and test (MSVC)
        if: matrix.toolset == 'msvc'
        shell: cmd
        env:
          DEBUG: 1
          WARNINGS: 1
          STANDALONE: 1
          _WIN32_WINNT: '0x0A00'
        run: |
          call "%VCVARSALL%" ${{ matrix.arch }} || exit /b 1
          cd src
          nmake -f Makefile.msc ${{ matrix.nmake-args }} || exit /b 1
          nmake -f Makefile.msc ${{ matrix.nmake-args }} check || exit /b 1

      - name: Build and test (MinGW)
        if: matrix.toolset == 'mingw'
        shell: cmd
        env:
          DEBUG: 1
          WARNINGS: 1
          STANDALONE: 1
        run: |
          set PATH=C:\msys64\mingw64\bin;C:\msys64\usr\bin;%PATH%
          cd src
          mingw32-make -f Makefile.mgw || exit /b 1
          mingw32-make -f Makefile.mgw check || exit /b 1
